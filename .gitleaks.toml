# ==============================================================================
# Tep cau hinh Gitleaks bo qua cac tep mau va tai lieu ky thuat
# ==============================================================================

[allowlist]
description = "Danh sach cho phep bo qua tep mau va tai lieu du an"
paths = [
  '''^\.env\.example$''',
  '''^docs/.*''',
  '''^docker-compose\.yml$''',
]
stopwords = [
  "your_gemini_api_key_here",
  "your_anthropic_api_key_here",
  "your_jwt_secret_key_here",
  "your_smtp_key_here",
]
