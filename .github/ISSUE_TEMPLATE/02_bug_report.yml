name: "🐛 Giao việc sửa lỗi (Bug Fix Assignment)"
description: Trưởng nhóm hoặc QA giao việc điều tra, khoanh vùng và khắc phục lỗi phần mềm cho thành viên
title: "fix(<module>): <mô tả ngắn gọn về lỗi>"
labels: ["bug", "needs-fix"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛠️ Phiếu Giao Việc Khắc Phục Sự Cố
        Thành viên nhận nhiệm vụ cần tái hiện được lỗi trước khi sửa, bổ sung bài kiểm thử hồi quy (Regression Test) để đảm bảo lỗi không tái diễn và không gây tác động phụ.

  - type: dropdown
    id: assigned_role
    attributes:
      label: Thành viên phụ trách xử lý (Assigned Role)
      options:
        - "Backend Developer"
        - "Frontend Developer"
        - "Fullstack Developer"
        - "QA & Automation Tester"
        - "DevOps Engineer"
        - "Thành viên dự án hoặc cá nhân"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Mức độ nghiêm trọng (Severity)
      options:
        - "P0 - Blocker (Sập hệ thống / Rò rỉ bảo mật / Mất dữ liệu - Cần xử lý ngay)"
        - "P1 - Critical (Chức năng cốt lõi bị hỏng, chưa có phương án tránh tạm thời)"
        - "P2 - Major (Tính năng phụ trợ có lỗi nhưng hệ thống vẫn vận hành được)"
        - "P3 - Minor (Lỗi giao diện, sai lệch hiển thị nhỏ, không ảnh hưởng nghiệp vụ)"
    validations:
      required: true

  - type: textarea
    id: defect_summary
    attributes:
      label: Hiện tượng lỗi & Hành vi sai lệch (Defect Summary)
      description: Mô tả sự cố đang xảy ra và hành vi kỳ vọng đúng theo đặc tả.
      placeholder: |
        - Hiện tượng thực tế: Khi bấm thanh toán đơn hàng có áp dụng mã giảm giá, hệ thống trả về HTTP 500.
        - Kỳ vọng theo spec: Hệ thống tính lại tổng tiền hợp lệ và chuyển tiếp sang cổng thanh toán.
    validations:
      required: true

  - type: textarea
    id: environment_and_logs
    attributes:
      label: Môi trường xảy ra lỗi & Bằng chứng (Environment & Logs)
      description: Môi trường (Local / Staging / Production), stacktrace, request payload hoặc ảnh chụp màn hình.
      placeholder: "Dán URL môi trường, đoạn log lỗi terminal, stacktrace từ server hoặc payload request/response tại đây..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Các bước tái hiện lỗi (Steps to Reproduce)
      value: |
        1. Đăng nhập bằng tài khoản thử nghiệm
        2. Thêm sản phẩm vào giỏ hàng
        3. Nhập mã giảm giá 'DISCOUNT50'
        4. Bấm nút 'Xác nhận thanh toán'
        5. Quan sát thấy lỗi 500 xuất hiện trên console
    validations:
      required: true

  - type: textarea
    id: suspected_root_cause
    attributes:
      label: Phỏng đoán nguyên nhân & File nghi vấn (Suspected Root Cause & Files)
      description: Định hướng từ Trưởng nhóm hoặc QA về các file/module cần khoanh vùng kiểm tra.
      placeholder: "Nghi ngờ lỗi chia cho 0 hoặc null pointer tại src/modules/orders/discount.service.ts..."

  - type: textarea
    id: fix_dod
    attributes:
      label: Yêu cầu nghiệm thu sửa lỗi (Definition of Done)
      description: Ghi lệnh kiểm thử hồi quy hoặc thao tác xác nhận kết quả theo môi trường thực tế.
      value: |
        - [ ] Tái hiện được lỗi và xác định chính xác nguyên nhân gốc rễ (Root Cause).
        - [ ] Viết bài Unit / Integration Test chứng minh lỗi đã được khắc phục hoàn toàn.
        - [ ] Toàn bộ bộ kiểm thử hiện hữu đều vượt qua (100% Green, không hồi quy).
        - [ ] Cập nhật tài liệu kỹ thuật tại docs/ nếu bản sửa đổi có điều chỉnh logic nghiệp vụ.
        - Lệnh hoặc thao tác kiểm chứng cần chạy khi bàn giao
    validations:
      required: true
