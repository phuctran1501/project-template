name: Deployments Management

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Môi trường cần cập nhật
        required: true
        default: Production
        type: choice
        options: [Production, Preview]
      target_url:
        description: URL HTTPS của bản triển khai
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    name: Production
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.PRODUCTION_URL != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: template-production
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ steps.publish.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Xác thực URL và gửi yêu cầu triển khai
        id: publish
        env:
          REQUESTED_URL: ${{ inputs.target_url }}
          CONFIGURED_URL: ${{ vars.PRODUCTION_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: node scripts/deployment.mjs

  deploy-preview:
    name: Preview
    if: >-
      (github.event_name == 'pull_request' && vars.PREVIEW_URL != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Preview
      url: ${{ steps.publish.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Xác thực và đăng ký URL
        id: publish
        env:
          REQUESTED_URL: ${{ inputs.target_url }}
          CONFIGURED_URL: ${{ vars.PREVIEW_URL }}
        run: node scripts/deployment.mjs
