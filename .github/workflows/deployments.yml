name: Deployments Management

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Chon moi truong can tao Deployment'
        required: true
        default: 'Production'
        type: choice
        options:
          - Production
          - Preview
      target_url:
        description: 'Duong dan URL ban demo tren Vercel hoac Render'
        required: false
        default: ''

jobs:
  # ============================================================================
  # Cong viec 1: Trien khai va gan link demo cho moi truong Production
  # ============================================================================
  deploy-production:
    name: Trien Khai Production Demo
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'Production')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.resolve-url.outputs.deploy_url }}
    steps:
      - name: Tai ma nguon tu repo
        uses: actions/checkout@v4

      # Kich hoat Render Deploy Hook neu nguoi dung da cau hinh secret
      - name: Kich hoat trien khai Render neu co
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Dang goi Render Deploy Hook de trien khai ban Production..."
          curl -s -X POST "$RENDER_HOOK" || true

      # Xac dinh duong dan URL demo de hien thi tren widget Deployments cua GitHub
      - name: Xac dinh duong dan URL Production
        id: resolve-url
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            FINAL_URL="${{ inputs.target_url }}"
          elif [ -n "${{ vars.PRODUCTION_URL }}" ]; then
            FINAL_URL="${{ vars.PRODUCTION_URL }}"
          else
            # Duong dan mau mac dinh tren Vercel gan voi ten kho ma nguon
            FINAL_URL="https://${{ github.event.repository.name }}.vercel.app"
          fi
          echo "deploy_url=$FINAL_URL" >> $GITHUB_OUTPUT
          echo "Moi truong Production da duoc kich hoat voi duong dan demo: $FINAL_URL"

  # ============================================================================
  # Cong viec 2: Trien khai va gan link demo cho moi truong Preview
  # ============================================================================
  deploy-preview:
    name: Trien Khai Preview Demo
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'Preview')
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.resolve-preview-url.outputs.deploy_url }}
    steps:
      - name: Tai ma nguon tu repo
        uses: actions/checkout@v4

      # Xac dinh duong dan URL preview cho nhanh hoac PR
      - name: Xac dinh duong dan URL Preview
        id: resolve-preview-url
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            FINAL_URL="${{ inputs.target_url }}"
          elif [ -n "${{ vars.PREVIEW_URL }}" ]; then
            FINAL_URL="${{ vars.PREVIEW_URL }}"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            FINAL_URL="https://${{ github.event.repository.name }}-pr-${{ github.event.pull_request.number }}.vercel.app"
          else
            FINAL_URL="https://${{ github.event.repository.name }}-preview.onrender.com"
          fi
          echo "deploy_url=$FINAL_URL" >> $GITHUB_OUTPUT
          echo "Moi truong Preview da duoc kich hoat voi duong dan demo: $FINAL_URL"
