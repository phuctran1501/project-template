name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # Cong viec 1: Quet an toan thong tin va kiem tra ro ri chuoi bi mat
  # ============================================================================
  security-audit:
    name: Quet Bao Mat Tu Dong
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon tu repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Su dung cong cu Gitleaks de phat hien ma khoa bi mat hoac token commit nham
      - name: Kiem tra ro ri bi mat qua Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # Cong viec 2: Kiem tra dinh dang ma nguon va chay bo kiem thu tu dong
