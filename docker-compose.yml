# ==============================================================================
# Tep khoi chay cac dich vu ha tang phat trien cuc bo
# Su dung lenh: docker compose up -d de bat dau
# Su dung lenh: docker compose down de dung va giai phong tai nguyen
# ==============================================================================

version: '3.8'

services:
  # Co so du lieu quan he PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-my_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bo nho dem Redis va quan ly hang doi cong viec
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # May chu thu nghiem gui thu dien tu cuc bo Mailpit
  mailpit:
    image: axllent/mailpit:latest
    container_name: local_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Cong SMTP nhan thu
      - "8025:8025" # Giao dien web xem hop thu den
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  # Vung luu tru ben vung cho co so du lieu
  postgres_data:
  # Vung luu tru ben vung cho bo nho dem
  redis_data:
